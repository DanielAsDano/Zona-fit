<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Zona Fit (GYM)</title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css" />
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/themes/primeonedark.css" />
    </h:head>

    <h:body>
        <div class="card">
            <h:form id="forma-clientes">
                <p:growl id="mensajes" showDetails="true" />
                <!--Menu Bar-->
                <div class="card">
                    <p:menubar>
                        <p:menuitem value="Inicio" icon="pi pi-fw pi-user" update=":forma-clientes:clientes-tabla" actionListener="#{indexController.cargarDatos}"/>
                        <p:menuitem value="Nuevo Cliente" icon="pi pi-fw pi-plus" actionListener="#{indexController.agregarCliente}" update=":forma-modal:cliente-ventana" oncomplete="PF('ventanaModalCliente').show()"/>
                    </p:menubar>
                </div>

                <!--Data table-->
                <div class="card">
                    <p:dataTable value="#{indexController.clientes}" var="cliente" id="clientes-tabla" widgetVar = "clientesTabla">
                        <f:facet name="header">
                            <div class="flex justify-content-center flex-wrap card-container yellow-container">
                                <div class="flex align-items-center justify-content-center w-20rem h-4rem bg-yellow-500 font-bold text-gray-900 border-round m-2">
                                    <h3 class="m-0">Zona Fit (GYM)</h3>
                                </div>
                            </div>
                        </f:facet>

                        <p:column headerText="Id">
                            <h:outputText value="#{cliente.id}"/>     
                        </p:column>

                        <p:column headerText="Nombre">
                            <h:outputText value="#{cliente.nombre}"/>
                        </p:column>
                        
                        <p:column headerText="Apellido">
                            <h:outputText value="#{cliente.apellido}"/>
                        </p:column>

                        <p:column headerText="Membresia">
                            <h:outputText value="#{cliente.membresia}"/>
                        </p:column>
                    </p:dataTable>
                </div>
            </h:form>

            <h:form id="forma-modal">
                <p:dialog header="Detalles Cliente" showEffect="fade" modal="true" widgetVar="ventanaModalCliente" responsive="true">
                    <p:outputPanel id="cliente-ventana" class="ui-fluid">
                        <div class="field">
                            <p:outputLabel for="nombre">Nombre</p:outputLabel>
                            <p:inputText id="nombre" value="#{indexController.clienteSeleccionado.nombre}" required="true"/>
                        </div>

                        <div class="field">
                            <p:outputLabel for="apellido">Apellido</p:outputLabel>
                            <p:inputText id="apellido" value="#{indexController.clienteSeleccionado.apellido}" required="true"/>
                        </div>

                        <div class="field">
                            <p:outputLabel for="membresia">Membresia</p:outputLabel>
                            <p:inputNumber id="membresia" value="#{indexController.clienteSeleccionado.membresia}" required="true"/>
                        </div>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Guardar" icon="pi pi-check" process="cliente-ventana @this" actionListener="#{indexController.guardarCliente}"/>
                        <p:commandButton value="Cancelar" icon="pi pi-timex" onclick="PF('ventanaModalCliente').hide()" class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>
            </h:form>
        </div>

        
    </h:body>
</html>
